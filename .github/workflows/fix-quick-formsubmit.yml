name: Fix Hungarian QUICK interest scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-quick-formsubmit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Hungarian interest buttons native anchors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('hu/keszletrol.html')
          txt = p.read_text(encoding='utf-8')

          # Make every product-level "Érdeklődés jelzése" control a real anchor.
          # This guarantees scrolling to the form even if JavaScript is unavailable.
          txt = re.sub(
              r'<button class="button button-red quick-interest" data-product="([^"]+)" type="button">Érdeklődés jelzése</button>',
              r'<a class="button button-red quick-interest" data-product="\1" href="#interesse">Érdeklődés jelzése</a>',
              txt
          )

          # Keep product preselection when JS is available, but do not control scrolling in JS.
          helper = '''<script>\n(() => {\n  const product = document.getElementById('q-product');\n  document.querySelectorAll('.quick-interest[data-product]').forEach(link => link.addEventListener('click', () => {\n    if (product) product.value = link.dataset.product || '';\n  }));\n})();\n</script>'''
          txt = re.sub(r'<script>\s*\(\(\) => \{.*?</script>\s*</body>', helper + '\n</body>', txt, count=1, flags=re.S)

          p.write_text(txt, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hu/keszletrol.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix Hungarian QUICK interest scrolling"
            git push
          fi
