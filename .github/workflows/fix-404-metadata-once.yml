name: Fix 404 metadata once

on:
  push:
    branches:
      - final-site-qa

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-site-qa
      - name: Fix 404 metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('404.html','hu/404.html','en/404.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('https://legradis.com', 'https://legradi.at')
              if 'name="robots"' not in s:
                  marker = '<meta content="#080808" name="theme-color"/>'
                  s = s.replace(marker, marker + '\n<meta content="noindex,follow" name="robots"/>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404.html hu/404.html en/404.html
          git commit -m "Fix 404 metadata" || exit 0
          git push origin HEAD:final-site-qa
