name: Static SEO metadata one-time update

on:
  push:
    branches:
      - seo-static-metadata

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-static-metadata
      - name: Update static SEO URLs and hreflang
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE = 'https://legradi.at'
          paths = list(Path('.').glob('*.html')) + list(Path('hu').glob('*.html')) + list(Path('en').glob('*.html'))
          changed = []

          for path in paths:
              if path.name == '404.html':
                  continue

              parts = path.parts
              lang_prefix = ''
              if parts[0] == 'hu':
                  lang_prefix = '/hu'
              elif parts[0] == 'en':
                  lang_prefix = '/en'

              page_suffix = '/' if path.name == 'index.html' else f'/{path.name}'
              canonical = f'{BASE}{lang_prefix}{page_suffix}'

              de_url = f'{BASE}{page_suffix}'
              hu_url = f'{BASE}/hu{page_suffix}'
              en_url = f'{BASE}/en{page_suffix}'
              alternates = (
                  f'<link href="{de_url}" hreflang="de" rel="alternate"/>\n'
                  f'<link href="{hu_url}" hreflang="hu" rel="alternate"/>\n'
                  f'<link href="{en_url}" hreflang="en" rel="alternate"/>\n'
                  f'<link href="{de_url}" hreflang="x-default" rel="alternate"/>'
              )

              original = path.read_text(encoding='utf-8')
              text = original.replace('https://legradis.com', BASE)

              text = re.sub(
                  r'<link href="[^"]*" rel="canonical"\s*/>',
                  f'<link href="{canonical}" rel="canonical"/>',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'<meta content="[^"]*" property="og:url"\s*/>',
                  f'<meta content="{canonical}" property="og:url"/>',
                  text,
                  count=1,
              )

              # Replace any existing static hreflang links, then insert the complete language set after canonical.
              text = re.sub(
                  r'\n?<link[^>]*hreflang="(?:de|hu|en|x-default)"[^>]*rel="alternate"[^>]*/>',
                  '',
                  text,
              )
              canonical_tag = f'<link href="{canonical}" rel="canonical"/>'
              if canonical_tag in text:
                  text = text.replace(canonical_tag, canonical_tag + '\n' + alternates, 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for item in changed:
              print(item)
          PY
      - name: Commit static SEO metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'hu/*.html' 'en/*.html'
          git commit -m "Finalize static SEO metadata"
          git push origin HEAD:seo-static-metadata
